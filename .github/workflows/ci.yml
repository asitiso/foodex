name: Foodex CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/foodex-world-home-room

permissions:
  contents: read

concurrency:
  group: foodex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build production app
        run: npm run build
